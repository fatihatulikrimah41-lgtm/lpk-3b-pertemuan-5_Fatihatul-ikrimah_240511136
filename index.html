<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 5 - Daftar Tugas &amp; Status API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Pertemuan 5 - Task &amp; API Hub</h1>
        <p class="subtitle">Fatihatul Ikrimah &bull; NIM 240511136</p>

        <form id="form-tugas">
            <input type="text" id="input-tugas" placeholder="Tambah tugas baru..." required>
            <select id="select-kategori">
                <option value="Web">Web</option>
                <option value="Desktop">Desktop</option>
                <option value="Mobile">Mobile</option>
            </select>
            <button type="submit">Tambah</button>
        </form>

        <div class="toolbar">
            <span id="info-tugas">0 tugas aktif</span>
            <button type="button" id="btn-muat-contoh">Muat Data Contoh</button>
        </div>

        <ul id="daftar-tugas"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
